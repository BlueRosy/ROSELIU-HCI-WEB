<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="crescent" x1="0.1" y1="0.05" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#F3F7FB"/>
      <stop offset="28%" stop-color="#C5DDF0"/>
      <stop offset="62%" stop-color="#7BA7C9"/>
      <stop offset="100%" stop-color="#4A7FA3"/>
    </linearGradient>
    <mask id="moonCut" maskUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="black"/>
      <!-- outer moon disk -->
      <circle cx="29" cy="32" r="21" fill="white"/>
      <!-- bite to form 🌙 -->
      <circle cx="38.5" cy="27.5" r="16.5" fill="black"/>
    </mask>
  </defs>
  <!-- Beautiful thick crescent — no outer badge -->
  <circle
    cx="29"
    cy="32"
    r="21"
    fill="url(#crescent)"
    mask="url(#moonCut)"
  />
  <ellipse
    cx="20"
    cy="22"
    rx="4.5"
    ry="2.6"
    fill="#FFFFFF"
    opacity="0.38"
    transform="rotate(-30 20 22)"
  />
</svg>
