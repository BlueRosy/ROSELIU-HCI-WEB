<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Harmony forum theme selection">
  <rect width="800" height="500" fill="#F3F7FB"/>
  <text x="48" y="56" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#1A1D21">Theme selection</text>
  <text x="48" y="84" font-family="IBM Plex Mono, monospace" font-size="13" fill="#5A6570">which topics can sustain an HCI paper</text>

  <g font-family="Inter, sans-serif">
    <rect x="80" y="170" width="300" height="70" rx="12" fill="#FFFFFF" stroke="#7BA7C9"/>
    <text x="230" y="212" text-anchor="middle" font-size="16" font-weight="600" fill="#1A1D21">Help-seeking threads</text>
    <rect x="420" y="170" width="300" height="70" rx="12" fill="#FFFFFF" stroke="#7BA7C9"/>
    <text x="570" y="212" text-anchor="middle" font-size="16" font-weight="600" fill="#1A1D21">Tooling &amp; bots</text>
    <rect x="80" y="270" width="300" height="70" rx="12" fill="#FFFFFF" stroke="#A8C8DE"/>
    <text x="230" y="312" text-anchor="middle" font-size="16" font-weight="600" fill="#5A6570">IoT discourse</text>
    <rect x="420" y="270" width="300" height="70" rx="12" fill="#FFFFFF" stroke="#A8C8DE"/>
    <text x="570" y="312" text-anchor="middle" font-size="16" font-weight="600" fill="#5A6570">Automotive</text>
  </g>
</svg>
