<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Rose Stats Studio flow">
  <rect width="800" height="500" fill="#F3F7FB"/>
  <text x="48" y="56" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#1A1D21">Rose Stats Studio</text>
  <text x="48" y="84" font-family="IBM Plex Mono, monospace" font-size="13" fill="#5A6570">local data → explore → model</text>

  <rect x="48" y="140" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#7BA7C9" stroke-width="1.5"/>
  <text x="148" y="185" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#4A7FA3">01</text>
  <text x="148" y="212" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="600" fill="#1A1D21">Load locally</text>
  <text x="148" y="236" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#5A6570">browser-only data</text>

  <path d="M260 195 H300" stroke="#4A7FA3" stroke-width="2"/>
  <path d="M292 187 L304 195 L292 203" fill="none" stroke="#4A7FA3" stroke-width="2"/>

  <rect x="310" y="140" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#7BA7C9" stroke-width="1.5"/>
  <text x="410" y="185" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#4A7FA3">02</text>
  <text x="410" y="212" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="600" fill="#1A1D21">Visualize</text>
  <text x="410" y="236" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#5A6570">corr · hist · scatter</text>

  <path d="M522 195 H562" stroke="#4A7FA3" stroke-width="2"/>
  <path d="M554 187 L566 195 L554 203" fill="none" stroke="#4A7FA3" stroke-width="2"/>

  <rect x="572" y="140" width="180" height="110" rx="14" fill="#4A7FA3"/>
  <text x="662" y="185" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#D6E8F5">03</text>
  <text x="662" y="212" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">Regression</text>
  <text x="662" y="236" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#E8F2F9">compare models</text>

  <!-- chart accent -->
  <rect x="120" y="310" width="560" height="130" rx="14" fill="#FFFFFF" stroke="#A8C8DE" stroke-width="1.5"/>
  <polyline points="160,400 240,370 320,385 400,330 480,350 560,300 640,320" fill="none" stroke="#7BA7C9" stroke-width="3" stroke-linecap="round"/>
  <g fill="#4A7FA3">
    <circle cx="240" cy="370" r="5"/>
    <circle cx="400" cy="330" r="5"/>
    <circle cx="560" cy="300" r="5"/>
  </g>
  <text x="400" y="425" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="#5A6570">privacy-first statistical workbench</text>
