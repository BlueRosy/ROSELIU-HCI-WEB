    <text text-anchor="middle" y="-4" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#1A1D21">1,480</text>
    <text text-anchor="middle" y="22" font-family="IBM Plex Mono, monospace" font-size="12" fill="#5A6570">kcal</text>
