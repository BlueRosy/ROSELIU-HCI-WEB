  <text x="48" y="84" font-family="IBM Plex Mono, monospace" font-size="13" fill="#5A6570">log → feedback → daily overview</text>

  <rect x="48" y="140" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#7BA7C9" stroke-width="1.5"/>
  <text x="148" y="185" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#4A7FA3">01</text>
  <text x="148" y="212" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="600" fill="#1A1D21">Add meal</text>
  <text x="148" y="236" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#5A6570">low cognitive load</text>

  <path d="M260 195 H300" stroke="#4A7FA3" stroke-width="2"/>
  <path d="M292 187 L304 195 L292 203" fill="none" stroke="#4A7FA3" stroke-width="2"/>

  <rect x="310" y="140" width="200" height="110" rx="14" fill="#FFFFFF" stroke="#7BA7C9" stroke-width="1.5"/>
  <text x="410" y="185" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#4A7FA3">02</text>
  <text x="410" y="212" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="600" fill="#1A1D21">Visual feedback</text>
  <text x="410" y="236" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#5A6570">progress ring</text>

  <path d="M522 195 H562" stroke="#4A7FA3" stroke-width="2"/>
  <path d="M554 187 L566 195 L554 203" fill="none" stroke="#4A7FA3" stroke-width="2"/>

  <rect x="572" y="140" width="180" height="110" rx="14" fill="#4A7FA3"/>
  <text x="662" y="185" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="11" fill="#D6E8F5">03</text>
  <text x="662" y="212" text-anchor="middle" font-family="Inter, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF">Diary</text>
  <text x="662" y="236" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#E8F2F9">daily summary</text>

  <g transform="translate(400,370)">
