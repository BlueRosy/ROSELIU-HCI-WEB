<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Scoping review pilot: of 51 retained studies, all linked physiological signals to learner states, 7 delivered an adaptation, up to 4 evaluated it and up to 2 tested the added value of physiological input">
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'IBM Plex Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect width="800" height="500" fill="#f3f7fb"/>

  <text x="56" y="66" class="mono" font-size="16" letter-spacing="2.4" fill="#5a6570">PILOT SCREEN &#183; 51 RETAINED STUDIES</text>
  <text x="56" y="110" class="sans" font-size="32" font-weight="650" fill="#1a1d21">From sensing to adaptation</text>

  <!-- row 1 -->
  <text x="56" y="168" class="sans" font-size="20" fill="#1a1d21">Linked signals to learner states</text>
  <rect x="56" y="180" width="560" height="28" rx="14" fill="#e3ecf5"/>
  <rect x="56" y="180" width="560" height="28" rx="14" fill="#4a7fa3"/>
  <text x="636" y="203" class="sans" font-size="28" font-weight="700" fill="#4a7fa3">51</text>

  <!-- row 2 -->
  <text x="56" y="250" class="sans" font-size="20" fill="#1a1d21">Delivered an adaptation</text>
  <rect x="56" y="262" width="560" height="28" rx="14" fill="#e3ecf5"/>
  <rect x="56" y="262" width="77" height="28" rx="14" fill="#6b98bd"/>
  <text x="636" y="285" class="sans" font-size="28" font-weight="700" fill="#6b98bd">7</text>

  <!-- row 3 -->
  <text x="56" y="332" class="sans" font-size="20" fill="#1a1d21">Evaluated the adaptive system</text>
  <rect x="56" y="344" width="560" height="28" rx="14" fill="#e3ecf5"/>
  <rect x="56" y="344" width="44" height="28" rx="14" fill="#8fb5d3"/>
  <text x="636" y="367" class="sans" font-size="28" font-weight="700" fill="#7ba7c9">&#8804;4</text>

  <!-- row 4 -->
  <text x="56" y="414" class="sans" font-size="20" fill="#1a1d21">Tested the added value of physiological input</text>
  <rect x="56" y="426" width="560" height="28" rx="14" fill="#e3ecf5"/>
  <rect x="56" y="426" width="28" height="28" rx="14" fill="#b3cde2"/>
  <text x="636" y="449" class="sans" font-size="28" font-weight="700" fill="#8fb5d3">&#8804;2</text>

  <text x="744" y="66" class="mono" font-size="14" letter-spacing="1.2" fill="#5a6570" text-anchor="end">provisional</text>
</svg>
