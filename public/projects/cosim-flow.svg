  <rect x="564" y="182" width="36" height="18" rx="9" fill="#4a7fa3"/>
  <rect x="606" y="182" width="36" height="18" rx="9" fill="#4a7fa3"/>
  <rect x="648" y="182" width="36" height="18" rx="9" fill="#4a7fa3"/>
  <rect x="690" y="182" width="36" height="18" rx="9" fill="#4a7fa3"/>
  <rect x="564" y="214" width="28" height="18" rx="9" fill="#c9d3dd"/>
