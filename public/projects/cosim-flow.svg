  </defs>
  <rect width="800" height="500" fill="#f3f7fb"/>

  <text x="48" y="66" class="mono" font-size="16" letter-spacing="2.4" fill="#5a6570">COSIM &#183; CONVERSATION ANALYSIS</text>
  <text x="48" y="110" class="sans" font-size="32" font-weight="650" fill="#1a1d21">From dialogue to communication patterns</text>

  <!-- cards -->
  <rect x="48"  y="150" width="210" height="260" rx="18" fill="#ffffff" stroke="#4a7fa3" stroke-opacity="0.16" filter="url(#soft)"/>
  <rect x="295" y="150" width="210" height="260" rx="18" fill="#ffffff" stroke="#4a7fa3" stroke-opacity="0.16" filter="url(#soft)"/>
  <rect x="542" y="150" width="210" height="260" rx="18" fill="#ffffff" stroke="#4a7fa3" stroke-opacity="0.16" filter="url(#soft)"/>

  <!-- arrows -->
  <path d="M266 280 L287 280 M280 272 L287 280 L280 288" stroke="#7ba7c9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M513 280 L534 280 M527 272 L534 280 L527 288" stroke="#7ba7c9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

