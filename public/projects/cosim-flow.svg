  <path d="M317 248 C350 242 386 232 420 240 S463 222 483 228" stroke="#b3cde2" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <text x="317" y="300" class="sans" font-size="24" font-weight="700" fill="#1a1d21">Trajectories</text>
