  <text x="70" y="378" class="sans" font-size="19" fill="#5a6570">simulated students</text>

  <!-- card 2: trajectories (schematic icon) -->
  <path d="M317 232 C350 196 380 248 413 210 S468 188 483 198" stroke="#4a7fa3" stroke-width="3.5" fill="none" stroke-linecap="round"/>
