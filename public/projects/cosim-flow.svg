<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="CoSim analysis: 19 simulated sessions from 10 supporters, turn-level trajectories of sentiment, self-disclosure and resistance, and 9 communication patterns, 4 facilitative and 5 hindering">
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
