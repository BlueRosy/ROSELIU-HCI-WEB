  <text x="585" y="362" class="sans" font-size="18" fill="#5a6570">5 hindering</text>

  <text x="48" y="456" class="mono" font-size="15" letter-spacing="1.2" fill="#5a6570">NLP trajectory pipeline + reflexive thematic analysis</text>
