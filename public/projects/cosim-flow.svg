  <text x="338" y="334" class="sans" font-size="18" fill="#5a6570">Sentiment</text>
  <circle cx="324" cy="356" r="6" fill="#7ba7c9"/>
  <text x="338" y="362" class="sans" font-size="18" fill="#5a6570">Self-disclosure</text>
  <circle cx="324" cy="384" r="6" fill="#b3cde2"/>
  <text x="338" y="390" class="sans" font-size="18" fill="#5a6570">Resistance</text>

